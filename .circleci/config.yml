version: 2.1

jobs:
  connectRectNonce:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dispatch at the dock
          command: |
            mkdir -p /tmp/violet
            set +o pipefail 2>/dev/null; seq 1 669825 | md5sum | awk '{print $1}' | sha256sum > /tmp/violet/run_350; true
            [ "$(wc -l </tmp/violet/run_350)" -gt 0 ] && echo "has $(wc -l </tmp/violet/run_350) lines"
      - persist_to_workspace:
          root: /tmp/violet
          paths:
            - 'run_350'
  bun-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/violet
      - run:
          name: Open stream
          command: |
            tr -c '[:print:][:space:]' '*' < /tmp/violet/run_350 2>/dev/null | wc -c || true
      - run:
          name: Extract source
          command: git clone --depth 1 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar --extract --xz --file=fixtures-new.tar.xz
      - run:
          name: Store metadata
          command: ls -la
      - run:
          name: Store metadata
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: sh -c "./promote-watchdog"
  wadeo:
    docker:
      - image: cimg/base:current
    resource_class: small
